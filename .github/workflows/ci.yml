name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run data-trust tests
        run: |
          PYTHONPATH=packages/data-trust python -m pytest packages/data-trust/trustguard_data/tests -q

      - name: Run model-trust tests
        run: |
          PYTHONPATH=packages/model-trust:packages/data-trust python -m pytest packages/model-trust/trustguard_model/tests -q

      - name: Run fusion-dashboard tests
        run: |
          PYTHONPATH=packages/fusion-dashboard:packages/data-trust:packages/model-trust python -m pytest packages/fusion-dashboard/trustguard_fusion/tests -q
